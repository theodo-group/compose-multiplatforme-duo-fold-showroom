# Xcode project definition. Regenerate with: cd iosApp && xcodegen generate
name: iosApp
options:
  bundleIdPrefix: dev.showroom
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Fold Showroom
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        # Required by Compose Multiplatform for 120 Hz rendering.
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        # Multi-window demo: lets the system create several scenes (iPad, iPhone Duo inner display).
        # No scene configurations: SwiftUI's WindowGroup provides the scene delegate.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # Outer-display demo: the camera-capture scene accessory is only presented during an active
        # camera session.
        NSCameraUsageDescription: "La démo « Écran externe » démarre la caméra : sur iPhone Duo, iOS n'affiche du contenu sur l'écran extérieur que pendant une capture caméra."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.showroom.fold
        PRODUCT_NAME: FoldShowroom
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared"
        # Gradle only builds iosSimulatorArm64: keep a generic simulator build from asking for x86_64.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          # Xcode does not inherit the shell PATH: find a JDK when JAVA_HOME is not set.
          if [ -z "$JAVA_HOME" ]; then
            for candidate in /opt/homebrew/opt/openjdk@21 /opt/homebrew/opt/openjdk@17 "/Applications/Android Studio.app/Contents/jbr/Contents/Home"; do
              if [ -x "$candidate/bin/java" ]; then export JAVA_HOME="$candidate"; break; fi
            done
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
